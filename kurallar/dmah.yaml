# Düşük Molekül Ağırlıklı Heparin (DMAH) kural seti — SUT 4.2.7
#
# KAYNAKLAR:
#   1) SUT 4.2.7 maddesinin resmi metni ("GENEL_SUTTTTT.pdf", sayfa 4 --
#      "4.2.7 - Düşük molekül ağırlıklı heparinlerin kullanım ilkeleri").
#   2) Bursa Eczacı Odası 32. Dönem SUT Komisyonu'nun DMAH özet tablosu
#      ("heparin.pdf") -- bilgilendirme amaçlı bir kaynak; resmi metnin
#      değinmediği ayrıntılarda (3 uzman hekimli sağlık kurulu raporu,
#      2 yıl geçerlilik, 3 aylık ara kuralı, İADE/KESİNTİ uyarıları,
#      gebelik ICD-10 kod listesi) bu tablo kullanıldı.
#
# UYUMSUZLUK UYARISI: İki kaynak bazı noktalarda farklı ayrıntı
# seviyesinde. Eczacı Odası tablosu >6 ay kullanım için "3 Uzman Hekim
# Raporu" ve "en fazla 2 yıl" diyor, bunun 3.12.2025 tarihli bir SUT
# değişikliğiyle eklendiğini belirtiyor; elimdeki resmi metin nüshası bu
# iki ayrıntıyı (3 kişi / 2 yıl) içermiyor -- muhtemelen değişiklik
# öncesi bir kopya. Branş listesinde ise resmi metin DAHA KAPSAMLI (8
# branş); bu dosyada branş listesi için resmi metin esas alındı. Elinizdeki
# en güncel SUT nüshasıyla bir kez karşılaştırmanızı öneririm.
#
# KAPSAM NOTU: ETKEN_MADDELER tablosunda enoksaparin, nadroparin,
# dalteparin, tinzaparin, bemiparin hepsi tek bir DMAH sınıfı altında
# toplandı (madde 4.2.7'nin metni "düşük molekül ağırlıklı heparinler"
# diye genel ifade kullanıyor). Belgede isim geçen sadece Oksapar
# (enoksaparin) ve Hibor (bemiparin) idi; nadroparin/dalteparin/
# tinzaparin aynı ilaç grubunda oldukları için (genel farmakoloji
# bilgisiyle) eklendi -- SUT'un bunları da aynı şekilde kapsadığını
# siz de teyit edin.

surum: "2026-10-21a"
kaynak: "Sağlık Uygulama Tebliği madde 4.2.7, düşük molekül ağırlıklı heparinler (DMAH)"

ayarlar:
  receteyi_de_degerlendir: true

ibareler:
  gebelik_haftasi_ifadesi:
    baslik: "Gebelik haftası ifadesi"
    esik: 0.75
    kaliplar:
      - "gebelik haftasında"
      - "gebelik haftası"
      - "hafta gebe"
      - "haftalık gebe"
      - "gebeliğin haftasında"

kurallar:

  - id: DMAH_FARKLI_ETKEN_MADDE_YASAK
    tip: tekil_sinif_kontrolu
    sinif: DMAH
    azami_urun: 1
    baslik: "Farklı etken maddeli DMAH'ların birlikte kullanımı"
    sut_madde: "SUT 4.2.7/4"
    seviye: HATA
    mesaj: >-
      Farklı etken maddeler içeren düşük molekül ağırlıklı heparinlerin (ör.
      enoksaparin + bemiparin, enoksaparin + nadroparin gibi) birlikte
      kullanılması halinde bedelleri Kurumca karşılanmaz. Aynı reçetede/raporda
      birden fazla farklı DMAH etken maddesi tespit edildi.

  - id: DMAH_RAPORSUZ_KOSULLARI
    tip: bilgi_notu
    kapsam: tumu
    baslik: "DMAH raporsuz ödeme koşulu"
    sut_madde: "SUT 4.2.7/2"
    seviye: UYARI
    tetikleyici:
      hepsi_bulunmali: [DMAH]
    mesaj: >-
      Düşük molekül ağırlıklı heparin (DMAH) tespit edildi. SUT 4.2.7/2 gereği
      raporsuz reçete YALNIZCA (a) yatan hastalarda veya (b) acil müdahale
      gerektiren durumlarda acil serviste geçerlidir. Reçete ayakta bir
      hastaya aitse ve rapor yoksa, uzman hekim raporu aranmalıdır (bkz.
      DMAH_SURE_VE_BRANS_OZETI).

  - id: DMAH_HEMODIYALIZ_ODENMEZ
    tip: bilgi_notu
    kapsam: tumu
    baslik: "Hemodiyaliz tedavisinde DMAH ayrıca ödenmez"
    sut_madde: "SUT 4.2.7/3"
    seviye: UYARI
    tetikleyici:
      hepsi_bulunmali: [DMAH]
    mesaj: >-
      Hemodiyaliz tedavilerinde heparinler (DMAH dahil) tanıya dayalı işlem
      puanına dahil olduğundan, reçete edilse dahi ayrıca bedeli ödenmez.
      Hastanın hemodiyaliz tedavisi görüp görmediğini teşhisten kontrol edin.

  - id: DMAH_RAPOR_DOZ_SEMASI_ZORUNLU
    tip: bilgi_notu
    kapsam: tumu
    baslik: "Raporda IU/mg cinsinden doz şeması zorunlu"
    sut_madde: "SUT 4.2.7 (ayrıca bkz. Protokol 3.3.1.d -- Bursa Eczacı Odası özeti)"
    seviye: UYARI
    tetikleyici:
      hepsi_bulunmali: [DMAH]
    mesaj: >-
      SUT 4.2.7 gereği raporda kullanılacak ilacın dozu (IU veya mg ve ünite
      cinsinden, ör. 4000IU, 6000IU, 40mg, 60mg) açıkça belirtilmelidir. Bu
      bilginin raporda yazılmaması İADE sebebidir; dozun hatalı yazılmış
      olması KESİNTİ sebebidir. Raporda bu doz şemasının bulunduğunu teyit edin.

  - id: DMAH_GEBELIK_HAFTA_IBARE
    tip: tani_kodu_ibare_kontrolu
    kapsam: urun
    baslik: "Gebelik teşhisinde gebelik haftası ifadesi"
    sut_madde: "SUT 4.2.7 (Bursa Eczacı Odası özeti)"
    seviye: HATA
    tetikleyici:
      hepsi_bulunmali: [DMAH]
    tani_onekleri:
      [O22.0, O22.1, O22.2, O22.3, O22.4, O22.5, O22.8, O22.9,
       O30.0, O30.1, O30.2, O30.8, O30.9, O22.1.2, O22.1.3,
       Z32.1, Z33, Z34.0, Z34.8, Z34.9,
       Z35.0, Z35.1, Z35.2, Z35.3, Z35.4, Z35.5, Z35.6, Z35.7, Z35.8, Z35.9,
       Z35.1.1, Z35.1.2, Z35.2.1, Z35.2.2, Z35.52]
    ibare: gebelik_haftasi_ifadesi
    mesaj_yok: >-
      Teşhis kodu gebelikle ilgili (O22/O30/Z32-Z35 grubu) ve DMAH tespit
      edildi. Bu durumda raporda veya reçetede gebelik haftasının
      belirtilmesi zorunludur; bu ifade tespit edilemedi.
    mesaj_var: "Gebelik haftası ifadesi mevcut."

  - id: DMAH_SURE_VE_BRANS_OZETI
    tip: bilgi_notu
    kapsam: tumu
    baslik: "DMAH rapor türü, süresi ve branş özeti"
    sut_madde: "SUT 4.2.7/1"
    seviye: BILGI
    tetikleyici:
      hepsi_bulunmali: [DMAH]
    mesaj: >-
      DMAH rapor kuralları üç duruma ayrılır: (1) En fazla 6 ay için TEK
      uzman hekim raporu yeterlidir, branş serbesttir. (2) 6 aydan uzun
      kullanımda SAĞLIK KURULU raporu gerekir; kurulda şu branşlardan en
      az birinin bulunması şarttır: onkoloji, hematoloji, kalp damar
      cerrahisi, kardiyoloji, göğüs hastalıkları, iç hastalıkları, genel
      cerrahi, nöroloji (Bursa Eczacı Odası'nın özetine göre bu rapor en
      az 3 uzman hekim imzalı olmalı ve en fazla 2 yıl geçerlidir -- bu iki
      ayrıntı resmi metnimde yoktu, güncel SUT nüshanızla teyit edin). (3)
      Gebelikte kadın hastalıkları ve doğum uzmanının yazdığı, en fazla 10
      ay süreli uzman hekim raporu yeterlidir. Rapordaki süre ve imza
      sahibi branş(lar)ı, geçerli duruma uyuyor mu kontrol edin.

  - id: DMAH_ENDIKASYON_UYUMU
    tip: bilgi_notu
    kapsam: urun
    baslik: "Enoksaparin endikasyon uyumu"
    sut_madde: "SUT 4.2.7 (Medula: 20.00 kodlu rapor, endikasyon uyumu aranır)"
    seviye: BILGI
    tetikleyici:
      hepsi_bulunmali: [DMAH]
    mesaj: >-
      Medula'da DMAH genelde 20.00 kodlu raporla çıkar ve endikasyon uyumu
      aranır. Oksapar (enoksaparin) KÜB'üne göre onaylı endikasyonlar:
      orta/yüksek riskli cerrahide (özellikle ortopedik/kanser cerrahisi)
      venöz tromboemboli (VTE) profilaksisi; akut kalp/solunum yetmezliği,
      ciddi enfeksiyon veya romatizmal hastalık nedeniyle mobilitesi
      azalmış akut medikal hastalarda VTE profilaksisi; hemodiyaliz
      sırasında ekstrakorporeal devre trombozunun önlenmesi; derin ven
      trombozu ve pulmoner emboli tedavisi (cerrahi gerektirebilecek
      pulmoner emboli hariç); akut koroner sendrom (ASA ile birlikte
      kararsız angina/NSTEMI, ve STEMI tedavisi). Teşhis bu listedeki bir
      durumla örtüşmüyorsa endikasyon dışı kullanım riski vardır. (Diğer
      DMAH etken maddelerinin -- bemiparin, nadroparin, dalteparin,
      tinzaparin -- kendi KÜB endikasyonları farklı olabilir; bu metin
      özellikle Oksapar/enoksaparin KÜB'ünden alınmıştır.)

  - id: DMAH_TEDAVI_ARASI_3AY
    tip: bilgi_notu
    kapsam: tumu
    baslik: "3 ay ve üzeri tedavi arasında eski raporlar geçersiz"
    sut_madde: "Bursa Eczacı Odası özeti (resmi metinde bu ayrıntı görülmedi)"
    seviye: BILGI
    tetikleyici:
      hepsi_bulunmali: [DMAH]
    mesaj: >-
      Tedaviye 3 ay veya daha uzun süre ara verilmişse, hastanın önceki
      tüm DMAH raporları geçersiz sayılır ve yeni bir rapor gerekir. Rapor
      ile reçete tarihleri arasında böyle bir boşluk olup olmadığını
      kontrol edin.