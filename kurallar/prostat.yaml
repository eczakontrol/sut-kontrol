# prostat.yaml
# Kaynak: Kullanıcının paylaştığı 13.3 ve 13.4 metni ve uygulama açıklamaları.
# Resmî belge tarihi/sürümü verilmedi; güncel mevzuat doğrulaması yapılmadı.
# Bu dosya karar destek tanımıdır; SGK ödeme onayı değildir.
# SUTCheck prostat setinde ilgili motor işleyicileri ve ilaç sözlüğü bağlıdır.

surum: "kullanici-metni-v1"
kaynak: "Kullanıcının paylaştığı prostat ilaçları 13.3 ve 13.4 hükümleri"

kaynak_durumu:
  resmi_guncellik_dogrulandi: false
  resmi_belge_tarihi: null
  kullanici_aciklamalari:
    - "BPH endikasyonunda raporlu ve raporsuz değerlendirmede N40 tanı kodu aranır."
    - "20.00 rapor kodu genellikle kullanılır; zorunlu olduğu belirtilmemiştir."

ayarlar:
  receteyi_de_degerlendir: true
  endikasyon: "Benign prostat hiperplazisi (BPH)"
  eksik_veri_sonucu: UYARI
  taninmayan_urun_sonucu: UYARI
  resmi_odeme_onayi_uret: false

# Aynı üründeki etken maddeler birlikte tanınmalıdır.
# Örnek: dutasterid + tamsulosin tek kombinasyon ürünü olarak tutulur.
etken_maddeler:
  alfuzosin: BPH_ALFA_BLOKER
  tamsulosin: BPH_ALFA_BLOKER
  terazosin: BPH_ALFA_BLOKER
  doksazosin: BPH_ALFA_BLOKER
  silodosin: BPH_ALFA_BLOKER
  finasterid: BPH_5ARI
  dutasterid: BPH_5ARI

es_adlar:
  doksazosio: doksazosin
  siladosin: silodosin

# Motor sözleşmesi:
# - rapor_var: Kullanıcının doğruladığı raporlu/raporsuz durum.
# - rapor: düzenleme/bitiş tarihi, rapor tipi, hekim branşı, rapor kodu,
#   tanı kodları ve ilaç ürünleri.
# - reçete: tarih, uzmanlık branşı, tanı kodları ve ilaç ürünleri.
# - hipertansiyon_eslik_ediyor: true / false / null.
#   true yalnızca kullanıcı belgeyle doğruladığında kullanılmalıdır.
#   null = bilinmiyor; yalnızca serbest metinde sözcük bulunması yeterli değildir.
# - Raporlu değerlendirmede tanı ve yetki rapordan, raporsuzda reçeteden alınır.
# - Kombinasyon kontrolü rapor ve reçete listelerine ayrı ayrı uygulanır.
#   Aynı ilaç iki belgede bulunduğu için iki kez sayılmaz.
# - Kombinasyon yasağı farklı etken maddelerin birlikte kullanımına ilişkindir.
#   Aynı etken maddeli iki ürün bu kuralla otomatik kombinasyon sayılmaz;
#   doz/tekrar kullanım açısından ayrıca elle değerlendirilir.
# - Takvim süresi 12 ay ve 6 aydır; 365/180 gün olarak hesaplanmaz.
#   Takvimde olmayan gün ilgili ayın son gününe uyarlanır.
# - Reçete tarihi düzenleme tarihinden önce veya etkili bitişten sonra ise HATA.
#   Etkili bitiş: belgede yazan bitiş ile düzenleme + azami ayın erken olanı.
# - Eksik tarih/branş/rapor tipi otomatik uygun sayılmaz; UYARI üretilir.

ibareler: {}

kurallar:
  - id: BPH_N40_TANI
    tip: tani_kodu_kontrolu
    kapsam: urun
    baslik: "BPH endikasyonunda N40 tanı kodu"
    sut_madde: "13.3 / 13.4; N40 şartı kullanıcı açıklamasına dayanır"
    seviye: HATA
    tetikleyici:
      herhangi_bulunmali: [BPH_ALFA_BLOKER, BPH_5ARI]
    zorunlu_kodlar: [N40]
    alt_kodlari_kabul_et: true
    raporlu_tani_kaynagi: rapor
    raporsuz_tani_kaynagi: recete
    mesaj_yok: >-
      BPH için değerlendirilen üründe N40 veya N40 alt tanı kodu bulunamadı.
      Raporlu işlemde raporun, raporsuz işlemde reçetenin tanılarını kontrol edin.
    mesaj_var: "BPH için N40 tanı kodu bulundu."

  - id: BPH_ALFA_BRANS
    tip: brans_kontrolu
    kapsam: urun
    baslik: "Alfa blokerlerde üroloji uzmanı yetkisi"
    sut_madde: "13.3"
    seviye: HATA
    tetikleyici:
      herhangi_bulunmali: [BPH_ALFA_BLOKER]
    izinli_branslar: [uroloji]
    uzman_hekim_zorunlu: true
    raporlu_brans_kaynagi: rapor
    raporsuz_brans_kaynagi: recete
    mesaj_yok: >-
      Alfuzosin, tamsulosin, terazosin, doksazosin veya silodosin BPH
      endikasyonunda raporsuz yalnızca üroloji uzman hekimince reçete edilir.
      Raporlu işlemde raporu düzenleyen hekimin üroloji uzmanı olması gerekir;
      bu rapora dayanarak tüm hekimler reçete edebilir.

  - id: BPH_ALFA_RAPOR_SURE
    tip: rapor_yetki_sure_kontrolu
    kapsam: urun
    baslik: "Alfa blokerler için 1 yıllık uzman hekim raporu"
    sut_madde: "13.3"
    seviye: HATA
    tetikleyici:
      herhangi_bulunmali: [BPH_ALFA_BLOKER]
    yalniz_raporlu: true
    gerekli_rapor_tipi: "uzman hekim"
    izinli_rapor_branslari: [uroloji]
    azami_sure_ay: 12
    recete_tarihi_rapor_araliginda_olmali: true
    mesaj_yok: >-
      Alfa bloker için üroloji uzmanının düzenlediği 1 yıl süreli uzman
      hekim raporu şartı sağlanmıyor veya reçete tarihi raporun geçerli
      aralığında değil. Belgedeki tarihleri, rapor tipini ve uzmanlığı inceleyin.

  - id: BPH_ALFA_BIRLIKTELIK
    tip: etken_madde_birliktelik_kontrolu
    kapsam: belge_ayri
    baslik: "Birden fazla alfa blokerin birlikte kullanılması"
    sut_madde: "13.3"
    seviye: HATA
    etken_maddeler: [alfuzosin, tamsulosin, terazosin, doksazosin, silodosin]
    azami_farkli_etken_madde: 1
    kombinasyon_urunlerinin_icerigini_dahil_et: true
    istisna:
      alan: hipertansiyon_eslik_ediyor
      muafiyet_degeri: true
      bilinmiyor_sonucu: UYARI
      yalniz_belgeyle_dogrulanmis_deger: true
    mesaj: >-
      BPH endikasyonunda bu gruptan birden fazla farklı etken madde birlikte
      kullanılmış. Paylaşılan 13.3 metnine göre bedelleri karşılanmaz;
      ancak hipertansiyonun eşlik ettiği BPH'de bu kombinasyon koşulu aranmaz.
    mesaj_istisna: >-
      Hipertansiyonun eşlik ettiği BPH belgeyle doğrulanmış: yalnızca 13.3
      alfa bloker kombinasyon yasağı uygulanmadı. Diğer şartlar devam eder.
    mesaj_bilinmiyor: >-
      Birden fazla alfa bloker bulundu; eşlik eden hipertansiyon durumu
      doğrulanmadığından kombinasyon istisnası değerlendirilemedi.

  - id: BPH_5ARI_BRANS
    tip: brans_kontrolu
    kapsam: urun
    baslik: "Finasterid ve dutasteridde üroloji uzmanı yetkisi"
    sut_madde: "13.4"
    seviye: HATA
    tetikleyici:
      herhangi_bulunmali: [BPH_5ARI]
    izinli_branslar: [uroloji]
    uzman_hekim_zorunlu: true
    raporlu_brans_kaynagi: rapor
    raporsuz_brans_kaynagi: recete
    mesaj_yok: >-
      Finasterid veya dutasterid, tamsulosin kombinasyonları dahil, raporsuz
      yalnızca üroloji uzman hekimince reçete edilir. Raporlu işlemde raporu
      düzenleyen hekimin üroloji uzmanı olması gerekir; bu rapora dayanarak
      tüm hekimler reçete edebilir.

  - id: BPH_5ARI_RAPOR_SURE
    tip: rapor_yetki_sure_kontrolu
    kapsam: urun
    baslik: "Finasterid/dutasterid için 6 aylık uzman hekim raporu"
    sut_madde: "13.4"
    seviye: HATA
    tetikleyici:
      herhangi_bulunmali: [BPH_5ARI]
    yalniz_raporlu: true
    gerekli_rapor_tipi: "uzman hekim"
    izinli_rapor_branslari: [uroloji]
    azami_sure_ay: 6
    recete_tarihi_rapor_araliginda_olmali: true
    mesaj_yok: >-
      Finasterid/dutasterid için, tamsulosin kombinasyonları dahil, üroloji
      uzmanının düzenlediği 6 ay süreli uzman hekim raporu şartı sağlanmıyor
      veya reçete tarihi raporun geçerli aralığında değil.

  - id: BPH_5ARI_BIRLIKTELIK
    tip: etken_madde_birliktelik_kontrolu
    kapsam: belge_ayri
    baslik: "Finasterid ve dutasteridin birlikte kullanılması"
    sut_madde: "13.4"
    seviye: HATA
    etken_maddeler: [finasterid, dutasterid]
    azami_farkli_etken_madde: 1
    kombinasyon_urunlerinin_icerigini_dahil_et: true
    hipertansiyon_istisnasi_yok: true
    mesaj: >-
      Finasterid ve dutasterid birlikte tespit edildi; tamsulosin içeren
      kombinasyon ürünlerinin içeriği de bu kontrole dahildir. Paylaşılan
      13.4 metnine göre bu grubun kombine kullanımında bedeller karşılanmaz.
      13.3'teki hipertansiyon istisnası bu gruba uygulanmaz.
    yorum_notu: >-
      Tamsulosin + dutasterid veya tamsulosin + finasterid içeren tek bir
      ürün, sırf iki etken maddeli olduğu için bu kuralla yasaklanmaz.
      Yasak, finasterid ve dutasteridin birlikte bulunması olarak modellenmiştir.
      Bu yorum resmî kaynak üzerinden ayrıca doğrulanmalıdır.

  - id: BPH_RAPOR_KODU_BILGI
    tip: rapor_kodu_bilgi_notu
    kapsam: tumu
    baslik: "20.00 rapor kodu hatırlatması"
    sut_madde: "Kullanıcının uygulama notu; 13.3/13.4 metninde belirtilmiyor"
    seviye: BILGI
    tetikleyici:
      herhangi_bulunmali: [BPH_ALFA_BLOKER, BPH_5ARI]
    yalniz_raporlu: true
    yaygin_rapor_kodlari: ["20.00"]
    zorunlu_kod_kontrolu: false
    mesaj: >-
      Kullanıcı açıklamasına göre BPH raporları genellikle 20.00 koduyla
      düzenlenir. Bu kod tek başına ödeme uygunluğu sağlamaz; farklı veya
      eksik kod bu dosyada otomatik ret nedeni yapılmamıştır.
      N40, uzmanlık ve geçerlilik şartlarını ayrıca değerlendirin.
